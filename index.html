<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1266d8" />
    <!-- الوسوم الثابتة إنجليزية لأن اللغة الافتراضية إنجليزية: الزاحف ومعاينة
         الرابط بالواتساب يقرآن هذا الرأس قبل أن يشتغل أي جافاسكربت، فوسمٌ
         عربي فوق مستند lang="en" تناقضٌ يفهرَس. العربية تبقى لغةً بديلة
         معلنة بـog:locale:alternate، وتظهر فعلياً بمجرد اختيارها. -->
    <meta name="description" content="doctorVet — veterinary clinic management: one medical record, a live operations board, inventory and till, WhatsApp campaigns and multi-branch. A simple interface that runs in your own currency." />
    <meta name="apple-mobile-web-app-title" content="doctorVet" />
    <title>doctorVet — Veterinary clinic management</title>

    <!-- Social share (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="doctorVet" />
    <meta property="og:title" content="doctorVet — your whole vet clinic in one place" />
    <meta property="og:description" content="One medical record, a live operations board, inventory and till, WhatsApp campaigns and multi-branch — in a simple interface that runs in your own currency." />
    <!-- صورة المشاركة. بسوقٍ ينتشر بالواتساب من طبيبٍ لزميله، الرابط بلا
         صورة يصل بطاقةً نصّية باهتة — والصورة تحتلّ مساحةً أكبر بالمحادثة.
         الرابط مطلق عمداً: زاحفو المشاركة لا يحلّون المسارات النسبية. -->
    <meta property="og:image" content="https://doctorvet.vet/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="doctorVet — veterinary clinic management" />
    <meta property="og:url" content="https://doctorvet.vet/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_IQ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="doctorVet — your whole vet clinic in one place" />
    <meta name="twitter:description" content="One medical record, operations board, inventory and till, WhatsApp campaigns and multi-branch — in a simple interface that runs in your own currency." />
    <meta name="twitter:image" content="https://doctorvet.vet/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- كل خطوط التطبيق بطلب واحد هنا — لا @import داخل CSS (يؤخر أول رسم)،
         ولا عائلات احتياط ثقيلة لا تُستعمل. العربي: IBM Plex Sans Arabic فقط. -->
    <!-- اللاتيني وحده هنا. الخطّ العربي (IBM Plex Sans Arabic) **لا يُحمَّل
         افتراضياً**: اللغة الافتراضية إنجليزية، وتنزيل عائلة عربية كاملة
         بأربعة أوزان على صفحةٍ لا حرف عربي فيها هو ثقلٌ خالص بالمسار الحرج.
         يُحقَن عند اختيار لغةٍ عربية الحرف — انظر ensureScriptFont في
         src/i18n/index.ts. -->
    <!-- **غير حاجب للرسم** عمداً. ورقة أنماط خارجية تُحجَب عليها الصفحة كلها
         حتى تصل، وهذا ملفٌ من طرفٍ ثالث: زمنه خارج سيطرتنا وخارج مراقبتنا.
         وقياسٌ على شبكة بطيئة أظهر شاشة الإقلاع نفسها — وهي HTML/CSS صرف
         بُنيت لتُرسم فوراً — رهينةً بانتظاره.
         الحيلة: media="print" يجعل المتصفّح يجلبه بلا حجب، وonload يعيده
         إلى all فتُطبَّق الخطوط. والنتيجة: تُرسم الصفحة بخطّ النظام خلال
         أجزاء من الثانية ثم تتبدّل الخطوط — وهذه هي مقايضة display=swap
         نفسها، ممتدّةً من ملفّ الخطّ إلى ورقة الأنماط التي تصفه. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" /></noscript>

    <!-- شاشة الإقلاع: HTML/CSS صرف بلا أي جافاسكربت، فتُرسم فوراً حتى قبل تحميل
         التطبيق. بدونها يشوف المستخدم صفحة بيضاء فارغة كل إقلاع بارد (وبعد أي
         تحديث للنسخة) فيظن أن النظام معلّق. React يستبدلها لحظة جهوزيته. -->
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f5f7fb; }
      #boot .b-in { text-align: center; font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; }
      #boot .b-ring { width: 34px; height: 34px; margin: 0 auto; border-radius: 50%;
        border: 3px solid #d7e3f5; border-top-color: #1266d8; animation: b-spin .8s linear infinite; }
      #boot .b-name { margin: 14px 0 0; font-size: 15px; font-weight: 800; color: #0f2543; letter-spacing: .2px; }
      #boot .b-sub { margin: 4px 0 0; font-size: 11.5px; font-weight: 600; color: #6b8299; }
      @keyframes b-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #boot { background: #0b1220; }
        #boot .b-ring { border-color: #1e2f47; border-top-color: #4d9bff; }
        #boot .b-name { color: #e8f1ff; }
        #boot .b-sub { color: #7c95ab; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <div class="b-in">
          <div class="b-ring"></div>
          <p class="b-name">doctorVet</p>
          <p class="b-sub">جاري فتح النظام…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
