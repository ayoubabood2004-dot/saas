# ============================================================================
# فحوصُ doctorVet على كلّ دفعة.
#
# لماذا هذا الملفّ موجود: حزمةُ الهجرات (`supabase/tests/run.sh`) تحتاج بوستغريس
# حقيقياً، ولا بوستغريس على جهاز التطوير (ولا Docker ولا WSL). فبقيت الحزمةُ
# **مكتوبةً ولم تُشغَّل ولا مرّة** طوال خمس دفعات: أربعةٌ وثلاثون تأكيداً كُتبت
# للهجرات 0164–0168 ولم يُنفَّذ منها واحد، وكلُّ رسالة دفعةٍ تعلنها ديناً.
# وفحصٌ لم يُشغَّل لا يُعرف أنه يفشل عند الكسر — وهو تعريفُ «إصلاحٍ بلا فحص».
#
# وأجهزةُ GitHub تحمل بوستغريس ١٦ أصلاً بنفس المسار الذي تتوقّعه الحزمة
# (`/usr/lib/postgresql/16/bin`)، والحزمةُ تنصب عنقودَها المؤقّت بنفسها — فلا
# خدمةَ ولا حاويةَ ولا سرَّ واحد. والمستودعُ عامّ: هذا الملفّ لا يحمل مفتاحاً
# ولا يمسّ الإنتاج، وكلُّ ما يفعله أن يبني قاعدةً فارغة ويُنزل عليها الهجرات.
# ============================================================================
name: فحوص

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# دفعةٌ جديدة على نفس الفرع تُلغي التي قبلها — لا طوابيرَ على شغلٍ فات.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: تثبيتُ الاعتماديات
        run: npm ci

      # `npm run build` يشغّل كلَّ الحرّاس ثم البناء الفعليّ — فهو `lint` وزيادة.
      - name: الحرّاس والبناء
        run: npm run build

      # الحزمةُ تنصب عنقوداً مؤقّتاً وتُنزل عليه الهجرات بترتيبها، ثم تفحص
      # سلوكَها بدور `authenticated` لا كـsuperuser وحده. وهي المرّةُ الأولى
      # التي تجري فيها فعلاً — فكلُّ فشلٍ هنا كشفٌ لا عطل.
      - name: حزمةُ الهجرات على بوستغريس حقيقيّ
        run: bash supabase/tests/run.sh
        env:
          PGBIN: /usr/lib/postgresql/16/bin

      # ضغطٌ عشوائيٌّ أوسع من الافتراضيّ: البذرةُ ثابتة فالفشلُ يُعاد بنفس
      # الحالة، والعددُ الكبير يُترك للسحابة لا لجهاز التطوير.
      - name: ضغطٌ عشوائيّ موسَّع
        run: node scripts/pos-fuzz-test.mjs
        env:
          FUZZ_N: "50000"
